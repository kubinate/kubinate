[package]
name = "kubinate-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Kubinate API and BFF — Axum HTTP server, route definitions."

[[bin]]
name = "kubinate-api"
path = "src/main.rs"

[dependencies]
kubinate-platform = { path = "../platform" }
kubinate-identity = { path = "../identity" }
kubinate-cluster = { path = "../cluster" }
kubinate-addons = { path = "../addons" }
kubinate-observability = { path = "../observability" }
kubinate-billing = { path = "../billing" }
kubinate-integrations = { path = "../integrations" }
kubinate-workflows = { path = "../workflows" }
kubinate-agent-proto = { path = "../agent-proto" }

# secrets crate exported by `secrecy` (re-export through platform).

tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
futures.workspace = true
axum.workspace = true
axum-extra.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
time.workspace = true
sqlx.workspace = true
redis.workspace = true
dotenvy.workspace = true
secrecy.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
url.workspace = true
webauthn-rs.workspace = true
tonic.workspace = true
prost.workspace = true
async-trait.workspace = true
argon2.workspace = true

[dev-dependencies]
hyper-util = { version = "0.1", features = ["tokio"] }
