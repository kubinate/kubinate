[package]
name = "kubinate-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nightly end-to-end harness: provision + destroy a real cluster on Hetzner."

[[bin]]
name = "kubinate-e2e"
path = "src/main.rs"

# Sprint 3 ticket 05 — runs `install_addon` against a kind cluster
# whose kubeconfig path is supplied via CLI / env. Stubs Hetzner +
# SSH out entirely so the kind job's wallclock budget is dominated
# by helm + image pulls, not Rust compilation of the full e2e
# binary.
[[bin]]
name = "kubinate-e2e-helm"
path = "src/bin/helm.rs"

[dependencies]
kubinate-platform = { path = "../platform" }
kubinate-cluster = { path = "../cluster" }
kubinate-identity = { path = "../identity" }
kubinate-integrations = { path = "../integrations" }
kubinate-workflows = { path = "../workflows" }
kubinate-addons = { path = "../addons" }

tokio.workspace = true
async-trait.workspace = true
sqlx.workspace = true
uuid.workspace = true
time.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
base64.workspace = true
rand.workspace = true
