# Kubinate local development stack.
#
# Everything an engineer needs to run `cargo run -p kubinate-api` against
# a realistic environment. Start with: `docker compose up -d`.
#
# Not for production: the long-term production topology is documented in
# ADR-0004.

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kubinate
      POSTGRES_PASSWORD: kubinate
      POSTGRES_DB: kubinate
      POSTGRES_MULTIPLE_DATABASES: kubinate,temporal
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-multiple-postgres-databases.sh:/docker-entrypoint-initdb.d/00-create-dbs.sh:ro
      # Sprint 4 ticket 07 — runtime app role with NOSUPERUSER so
      # RLS actually applies. The `01-` numeric prefix orders
      # init scripts alphabetically; runs after the multi-DBs
      # script.
      - ./scripts/create-kubinate-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubinate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: kubinate
      POSTGRES_PWD: kubinate
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.32.0
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

  # Observability stack (optional, for engineers working on the proxy).
  # Start with: `docker compose --profile obs up -d`.
  prometheus:
    image: prom/prometheus:v3.0.0
    profiles: [obs]
    restart: unless-stopped
    volumes:
      - ./config/dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [obs]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3001:3000"

volumes:
  pgdata:
