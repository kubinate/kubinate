---
# This role assembles the unified docker-compose.yml + the env file the
# api binary reads, then `docker compose up -d`s the whole stack.
# Every container role above has prepared its on-disk prerequisites
# (mounts, init scripts) — here we just render templates and run.

- name: Ensure compose dir exists
  ansible.builtin.file:
    path: "{{ kubinate_compose_dir }}"
    state: directory
    owner: kubinate
    group: kubinate
    mode: "0750"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ kubinate_compose_dir }}/docker-compose.yml"
    owner: kubinate
    group: kubinate
    mode: "0640"
  notify: restart compose stack

- name: Render kubinate-api env file
  ansible.builtin.template:
    src: api.env.j2
    dest: "{{ kubinate_env_file }}"
    owner: kubinate
    group: kubinate
    # 0400 — only the kubinate user can read; KEK + Stripe keys live here.
    mode: "0400"
  notify: restart compose stack

- name: Pull latest images
  community.docker.docker_compose_v2:
    project_src: "{{ kubinate_compose_dir }}"
    pull: always
    state: present
  register: compose_state

- name: Confirm api is reachable on its loopback port
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/healthz
    return_content: false
    status_code: 200
  register: healthz
  retries: 12
  delay: 5
  until: healthz.status == 200
