# Copy to inventory.ini and fill in. inventory.ini is gitignored.
#
# `kubinate-cp-01` is the literal hostname Terraform assigns; you can
# rename freely as long as the group `[control_plane]` stays consistent.

[control_plane]
kubinate-cp-01 ansible_host=203.0.113.42 ansible_user=kubinate

[control_plane:vars]
# Where Terraform attaches the data volume. Cloud-init formats it ext4
# but does not auto-mount; the `postgres` role does.
kubinate_data_device=/dev/disk/by-id/scsi-0HC_Volume_xxxxxxxx
kubinate_data_mount=/var/lib/kubinate/data
