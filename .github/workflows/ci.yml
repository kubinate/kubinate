name: ci

# Sprint 2 ticket 02: workspace tests + lint on every PR.
#
# Two jobs run in parallel:
#   * rust     — cargo fmt, clippy, test against an ephemeral Postgres,
#                plus the no-token-logging grep guard.
#   * frontend — svelte-check + eslint + prettier.
#
# Both gate `main`. The nightly E2E (nightly-e2e.yml) is a separate
# concern — it runs against a real Hetzner project and is scheduled,
# not PR-triggered.
#
# Security note: every shell step routes user-controlled input through
# `env:`. We use `github.ref` only in the `concurrency` block (not in
# `run:`), and reference no PR/commit metadata anywhere in shell — see
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust — workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubinate
          POSTGRES_PASSWORD: kubinate
          POSTGRES_DB: kubinate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kubinate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://kubinate:kubinate@localhost:5432/kubinate
      # `#[sqlx::test]` reads DATABASE_URL to clone per-test template
      # DBs. KUBINATE_KEK is consumed by `PgcryptoStore::from_env` —
      # tests that build a store explicitly with `fresh_kek()` ignore it.
      KUBINATE_KEK: aQABAgMEBQYHCAkKCwwNDg8QERITFBUWFxgZGhscHR4f
      RUST_LOG: warn

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90'
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        # Surfaces lint issues in the PR check log without gating.
        # CONTRIBUTING.md aspires to `-D warnings`, but the existing
        # codebase carries ~88 pedantic / missing_docs warnings (from
        # the `define_id!` macro and the workspace-level
        # `clippy::pedantic` opt-in). Tightening to `-D warnings` is a
        # Sprint 3 tracked follow-up — making CI fail on every PR
        # before that cleanup would block the team.
        run: cargo clippy --workspace --all-targets --all-features

      - name: cargo test (lib + integration)
        run: cargo test --workspace --no-fail-fast

      - name: tracing-event sensitive-field guard
        run: ./scripts/check-no-token-logging.sh

  frontend:
    name: frontend — svelte-check + lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: lint
        run: npm run lint

      - name: vitest
        run: npm test -- --run
